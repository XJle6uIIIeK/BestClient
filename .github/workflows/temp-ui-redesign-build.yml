name: Temporary UI Redesign Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["Check style", "Spelling"]
    types: [completed]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: ui-redesign-browser-20261024
          submodules: true
          fetch-depth: 1

      - name: Validate redesign patch
        shell: pwsh
        run: python scripts/apply_browser_redesign.py --check

      - name: Apply native redesign
        shell: pwsh
        run: python scripts/apply_browser_redesign.py

      - name: Configure Release x64
        shell: pwsh
        run: >-
          cmake -S . -B release -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DDISCORD=OFF
          -DTOOLS=OFF
          -DAUTOUPDATE=OFF
          -DVULKAN=OFF
          -DWEBSOCKETS=OFF
          -DPREFER_BUNDLED_LIBS=ON
          -DDOWNLOAD_GTEST=ON
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=.

      - name: Build client
        shell: pwsh
        run: cmake --build release --config Release --target everything --parallel 2

      - name: Package client
        shell: pwsh
        run: cmake --build release --config Release --target package_default --parallel 2

      - name: Collect package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $pkg = Get-ChildItem -Path release -Filter "*-win64.zip" | Select-Object -First 1
          if (-not $pkg) { throw "Win64 package was not generated" }
          Copy-Item $pkg.FullName artifacts/BestClient-UI-Redesign-win64.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: BestClient-UI-Redesign-win64
          path: artifacts/BestClient-UI-Redesign-win64.zip
          if-no-files-found: error
